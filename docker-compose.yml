services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app:cached
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
    depends_on:
      - meilisearch

  meilisearch:
    image: getmeili/meilisearch
    container_name: meilisearch
    ports:
      - "7700:7700"
    env_file:
      - .env
    environment:
      MEILI_EXPERIMENTAL_CONTAINS_FILTER: "true"
      MEILI_MASTER_KEY: ${MEILI_API_KEY}
    restart: unless-stopped
